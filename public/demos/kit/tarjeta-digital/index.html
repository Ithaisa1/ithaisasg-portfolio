<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Demo · Tarjeta digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   ✏️  EDITA AQUÍ TUS DATOS
   Cambia solo el texto entre comillas "...". Si no usas una red social,
   deja las comillas vacías "" y el botón desaparecerá solo.
   ===================================================================== */
const TARJETA = {
  nombre: "María González",
  profesion: "Fotógrafa de bodas y eventos",
  bio: "Capturo los momentos que recordarás toda la vida. Más de 10 años de experiencia en Madrid y alrededores.",

  // Foto: pon la ruta de tu imagen (ej: "foto.jpg") o deja "" para mostrar tus iniciales
  foto: "",

  // Tema de color: "coral", "oceano", "bosque", "lavanda", "noche" o "dorado"
  tema: "coral",

  // Contacto
  telefono: "+34 600 000 000",
  whatsapp: "34600000000",          // con código de país, sin + ni espacios
  mensajeWhatsapp: "¡Hola María! Vi tu tarjeta y me gustaría pedir información.",
  email: "hola@mariagonzalez.com",
  web: "https://mariagonzalez.com",
  direccion: "Calle Gran Vía 1, Madrid",

  // Redes sociales (deja "" las que no uses)
  instagram: "https://instagram.com/",
  facebook: "",
  tiktok: "https://tiktok.com/",
  linkedin: "",
  youtube: "",

  // Botones personalizados (puedes añadir más líneas)
  enlaces: [
    { texto: "📸 Ver mi portafolio", url: "https://mariagonzalez.com/portafolio" },
    { texto: "💍 Paquetes de boda 2027", url: "https://mariagonzalez.com/precios" },
    { texto: "⭐ Opiniones de clientes", url: "https://g.page/" }
  ],

  // Servicios (aparecen como etiquetas)
  servicios: ["Bodas", "Sesiones de pareja", "Eventos", "Retratos", "Producto"],

  horario: "Lunes a viernes · 9:00 – 19:00"
};
/* ===================== FIN DE LA ZONA EDITABLE ===================== */
</script>

<style>
:root{--c1:#ff7a59;--c2:#ff3d7f;--fondo:#fff7f4;--texto:#1f1a1c;--suave:#6f6569;--tarjeta:#ffffff;--borde:#f1e4df}
[data-tema="oceano"]{--c1:#2bb3ff;--c2:#4f46e5;--fondo:#f3f7ff;--borde:#e1e8f8}
[data-tema="bosque"]{--c1:#34c38f;--c2:#0f766e;--fondo:#f2faf6;--borde:#dcefe6}
[data-tema="lavanda"]{--c1:#c084fc;--c2:#7c3aed;--fondo:#f8f5ff;--borde:#ebe3fb}
[data-tema="dorado"]{--c1:#e7b75f;--c2:#9a6b1f;--fondo:#fbf8f1;--borde:#efe6d2}
[data-tema="noche"]{--c1:#a78bfa;--c2:#22d3ee;--fondo:#0f0f17;--texto:#f4f4f8;--suave:#a3a3b5;--tarjeta:#1a1a26;--borde:#2a2a3a}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;display:flex;justify-content:center;padding:0 0 40px}
.tarjeta{width:100%;max-width:440px;position:relative}
.cabecera{height:150px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.cabecera::before,.cabecera::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.15)}
.cabecera::before{width:220px;height:220px;top:-90px;right:-60px}
.cabecera::after{width:140px;height:140px;bottom:-70px;left:-30px}
.compartir{position:absolute;top:16px;right:16px;z-index:2;border:none;background:rgba(255,255,255,.25);backdrop-filter:blur(6px);color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.compartir:hover{background:rgba(255,255,255,.4)}
.perfil{text-align:center;padding:0 22px;margin-top:-62px;position:relative}
.avatar{width:124px;height:124px;border-radius:50%;margin:0 auto;border:5px solid var(--fondo);background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.6rem;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.profesion{font-weight:600;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
.bio{color:var(--suave);font-size:.95rem;line-height:1.6;margin-top:12px}

.acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:24px 22px 8px}
.accion{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--texto);font-size:.72rem;font-weight:600}
.accion .ic{width:56px;height:56px;border-radius:18px;background:var(--tarjeta);border:1px solid var(--borde);display:grid;place-items:center;transition:transform .2s,box-shadow .2s;color:var(--c2)}
.accion:hover .ic{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.accion svg{width:24px;height:24px}

.bloque{padding:14px 22px}
.etiqueta{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-bottom:10px}
.enlaces{display:grid;gap:10px}
.enlace{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde);color:var(--texto);text-decoration:none;font-weight:600;transition:transform .2s,border-color .2s}
.enlace:hover{transform:scale(1.02);border-color:var(--c1)}
.enlace span:last-child{color:var(--c2);font-size:1.1rem}

.servicios{display:flex;flex-wrap:wrap;gap:8px}
.servicios span{padding:7px 14px;border-radius:30px;font-size:.82rem;font-weight:600;background:var(--tarjeta);border:1px solid var(--borde)}

.redes{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.redes a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tarjeta);border:1px solid var(--borde);color:var(--texto);transition:all .2s}
.redes a:hover{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.redes svg{width:20px;height:20px}

.info{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:6px 18px}
.info p{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:.9rem;color:var(--suave)}
.info p+p{border-top:1px solid var(--borde)}

.guardar{display:block;width:calc(100% - 44px);margin:18px auto 0;padding:17px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 30px -8px var(--c2);transition:transform .2s}
.guardar:hover{transform:translateY(-2px)}
.pie{text-align:center;font-size:.75rem;color:var(--suave);margin-top:26px}

.aparecer{opacity:0;transform:translateY(16px);animation:entrar .6s ease forwards}
@keyframes entrar{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.aparecer{animation:none;opacity:1;transform:none}}
.aviso{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--texto);color:var(--fondo);padding:11px 20px;border-radius:30px;font-size:.88rem;font-weight:600;transition:transform .3s;z-index:9}
.aviso.mostrar{transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="tarjeta">
  <div class="cabecera">
    <button class="compartir" id="compartir" aria-label="Compartir tarjeta">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
  </div>

  <section class="perfil aparecer">
    <div class="avatar" id="avatar"></div>
    <h1 id="nombre"></h1>
    <p class="profesion" id="profesion"></p>
    <p class="bio" id="bio"></p>
  </section>

  <nav class="acciones aparecer" id="acciones" style="animation-delay:.1s"></nav>

  <section class="bloque aparecer" style="animation-delay:.2s">
    <div class="enlaces" id="enlaces"></div>
  </section>

  <section class="bloque aparecer" id="bloque-servicios" style="animation-delay:.3s">
    <p class="etiqueta">Servicios</p>
    <div class="servicios" id="servicios"></div>
  </section>

  <section class="bloque aparecer" style="animation-delay:.4s">
    <div class="info" id="info"></div>
  </section>

  <section class="bloque aparecer" style="animation-delay:.5s">
    <div class="redes" id="redes"></div>
  </section>

  <button class="guardar aparecer" id="guardar" style="animation-delay:.6s">＋ Guardar contacto</button>
  <p class="pie" id="pie"></p>
</main>
<div class="aviso" id="aviso"></div>

<script>
(function(){
  const T = TARJETA;
  const $ = id => document.getElementById(id);
  document.documentElement.dataset.tema = T.tema;
  document.title = T.nombre + " · " + T.profesion;

  // Iconos SVG
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const I = {
    tel: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
    wa: svg('<path d="M3 21l1.7-5A9 9 0 1 1 8 19.4z"/><path d="M9 10c0 3 2 5 5 5l1.2-1.2 2 1-1 1.8C12 17 7 12 7.4 8.8L9.2 7.8l1 2z"/>'),
    mail: svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>'),
    web: svg('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>'),
    pin: svg('<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
    reloj: svg('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
    instagram: svg('<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor"/>'),
    facebook: svg('<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'),
    tiktok: svg('<path d="M9 12a4 4 0 1 0 4 4V2c.5 2.5 2.5 4.5 5 5"/>'),
    linkedin: svg('<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/>'),
    youtube: svg('<path d="M22.5 6.4a2.8 2.8 0 0 0-2-2C18.9 4 12 4 12 4s-6.9 0-8.5.4a2.8 2.8 0 0 0-2 2A29 29 0 0 0 1 12a29 29 0 0 0 .5 5.6 2.8 2.8 0 0 0 2 2C5.1 20 12 20 12 20s6.9 0 8.5-.4a2.8 2.8 0 0 0 2-2A29 29 0 0 0 23 12a29 29 0 0 0-.5-5.6z"/><path d="M9.8 15.5l5.7-3.5-5.7-3.5z"/>')
  };

  // Perfil
  const iniciales = T.nombre.split(" ").filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  $("avatar").innerHTML = T.foto ? `<img src="${T.foto}" alt="${T.nombre}">` : iniciales;
  $("nombre").textContent = T.nombre;
  $("profesion").textContent = T.profesion;
  $("bio").textContent = T.bio;
  $("pie").textContent = "© " + new Date().getFullYear() + " " + T.nombre;

  // Botones de acción rápida
  const acciones = [
    T.telefono && { t: "Llamar", i: I.tel, u: "tel:" + T.telefono.replace(/\s/g, "") },
    T.whatsapp && { t: "WhatsApp", i: I.wa, u: `https://wa.me/${T.whatsapp}?text=${encodeURIComponent(T.mensajeWhatsapp || "")}` },
    T.email && { t: "Email", i: I.mail, u: "mailto:" + T.email },
    T.web && { t: "Web", i: I.web, u: T.web }
  ].filter(Boolean);
  $("acciones").style.gridTemplateColumns = `repeat(${acciones.length},1fr)`;
  $("acciones").innerHTML = acciones.map(a =>
    `<a class="accion" href="${a.u}" target="_blank" rel="noopener"><span class="ic">${a.i}</span>${a.t}</a>`).join("");

  // Enlaces
  $("enlaces").innerHTML = T.enlaces.map(e =>
    `<a class="enlace" href="${e.url}" target="_blank" rel="noopener"><span>${e.texto}</span><span>→</span></a>`).join("");

  // Servicios
  if (T.servicios.length) $("servicios").innerHTML = T.servicios.map(s => `<span>${s}</span>`).join("");
  else $("bloque-servicios").remove();

  // Información
  const info = [];
  if (T.direccion) info.push(`<p>${I.pin.replace("<svg", '<svg width="18" height="18"')} <a href="https://maps.google.com/?q=${encodeURIComponent(T.direccion)}" target="_blank" rel="noopener" style="color:inherit">${T.direccion}</a></p>`);
  if (T.horario) info.push(`<p>${I.reloj.replace("<svg", '<svg width="18" height="18"')} ${T.horario}</p>`);
  if (info.length) $("info").innerHTML = info.join(""); else $("info").parentElement.remove();

  // Redes
  const redes = ["instagram", "facebook", "tiktok", "linkedin", "youtube"].filter(r => T[r]);
  $("redes").innerHTML = redes.map(r =>
    `<a href="${T[r]}" target="_blank" rel="noopener" aria-label="${r}">${I[r]}</a>`).join("");

  // Aviso
  function aviso(t) {
    $("aviso").textContent = t;
    $("aviso").classList.add("mostrar");
    setTimeout(() => $("aviso").classList.remove("mostrar"), 2200);
  }

  // Guardar contacto (descarga un archivo .vcf que el móvil abre en Contactos)
  $("guardar").addEventListener("click", () => {
    const partes = T.nombre.split(" ");
    const vcf = [
      "BEGIN:VCARD", "VERSION:3.0",
      `N:${partes.slice(1).join(" ")};${partes[0]};;;`,
      `FN:${T.nombre}`,
      `TITLE:${T.profesion}`,
      T.telefono && `TEL;TYPE=CELL:${T.telefono.replace(/\s/g, "")}`,
      T.email && `EMAIL:${T.email}`,
      T.web && `URL:${T.web}`,
      T.direccion && `ADR;TYPE=WORK:;;${T.direccion};;;;`,
      `NOTE:${T.bio}`,
      "END:VCARD"
    ].filter(Boolean).join("\r\n");
    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
    enlace.download = T.nombre.replace(/\s+/g, "_") + ".vcf";
    enlace.click();
    aviso("Contacto descargado ✓");
  });

  // Compartir
  $("compartir").addEventListener("click", async () => {
    const datos = { title: T.nombre, text: T.profesion, url: location.href };
    if (navigator.share) { try { await navigator.share(datos); } catch (e) {} }
    else { navigator.clipboard.writeText(location.href).then(() => aviso("Enlace copiado ✓")); }
  });
})();
</script>
<!-- Aviso añadido para el portfolio -->

</body>
</html>
